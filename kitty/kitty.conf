# ==============================================================================
# MANJARO GNOME - KITTY TERMINAL CONFIGURATION
# Platform: Manjaro Linux GNOME (Arch-based / Wayland)
# Developer: parikesitad-pm
# Theme: Modern Glassmorphism
# ==============================================================================

# Fonts
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic

font_size        11.0
bold_is_bright   yes

# Performance & Rendering
text_composition_strategy legacy
background_opacity 0.85
dynamic_background_opacity yes
confirm_os_window_close 0

# Window Layout & Padding
window_padding_width 12
placement_strategy center
hide_window_decorations no
remember_window_size yes
initial_window_width 900
initial_window_height 560

# Cursor & Mouse
cursor #E74C3C
cursor_text_color #1E1E2E
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval -1
mouse_hide_wait 3.0
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Scrollback
scrollback_lines 10000

# Modern Glassmorphism Color Palette
foreground            #F8F8F2
background            #0E1118
selection_foreground  #FFFFFF
selection_background  #C0392B

# Black
color0  #21222C
color8  #6272A4

# Red (GN Crimson)
color1  #FF5555
color9  #FF6E6E

# Green (GN Particles)
color2  #50FA7B
color10 #69FF94

# Yellow (GN Condenser Amber)
color3  #F1FA8C
color11 #FFFFA5

# Blue (Accent Blue)
color4  #BD93F9
color12 #D6ACFF

# Magenta (GN Beam)
color5  #FF79C6
color13 #FF92DF

# Cyan (GN Drive Glow)
color6  #8BE9FD
color14 #A4FFFF

# White
color7  #F8F8F2
color15 #FFFFFF

# Tab Bar styling
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #FFFFFF
active_tab_background   #C0392B
inactive_tab_foreground #8E2A20
inactive_tab_background #1E1E2E
