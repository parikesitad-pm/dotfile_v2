# ==============================================================================
# GUNDAM CELESTIAL - KITTY TERMINAL CONFIGURATION
# Platform: Manjaro Linux GNOME (Wayland)
# Author: parikesitad-pm
# ==============================================================================

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# bold_is_bright yes  (opsi ini gak dikenal kitty, dimatiin)

# Window Layout
placement_strategy center
hide_window_decorations no
remember_window_size yes
initial_window_width 900
initial_window_height 560

# Performance & Rendering
dynamic_background_opacity yes
confirm_os_window_close 0

# Cursor & Mouse
cursor_beam_thickness 1.8
cursor_blink_interval -1
mouse_hide_wait       3.0

# Scrollback
scrollback_lines 3000

# Gundam Celestial Being Color Scheme
# Author: parikesitad-pm

# Window & Font Configuration
window_padding_width 8
background_opacity 0.95

# Core Colors
background            #1E1E2E
foreground            #ECEFF4
selection_background  #1A5FB4
selection_foreground  #ECEFF4

# Cursor (GN Particle Glow)
cursor                #2EC27E
cursor_text_color     #1E1E2E
cursor_shape          beam

# Window Borders
active_border_color   #2EC27E
inactive_border_color #313244

# Tab Bar
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground #ECEFF4
active_tab_background #1A5FB4
active_tab_font_style bold
inactive_tab_foreground #888B98
inactive_tab_background #181825

# ANSI 16 Colors (Gundam Celestial Palette)
# Black
color0  #1E1E2E
color8  #45475A

# Red (Crimson Accent)
color1  #ED333B
color9  #FF5555

# Green (GN Particles)
color2  #2EC27E
color10 #57E39E

# Yellow (Solar Core)
color3  #F6D32D
color11 #F9E2AF

# Blue (Celestial Primary)
color4  #1A5FB4
color12 #3584E4

# Magenta
color5  #B48EAD
color13 #C678DD

# Cyan / Teal
color6  #2EC27E
color14 #89DCEB

# White
color7  #ECEFF4
color15 #FFFFFF

# ---------- Tampilan ala macOS ----------
# Title bar nyatu sama warna background (seamless kayak Terminal macOS)
wayland_titlebar_color background
# Tab bar di atas, kayak tab macOS
tab_bar_edge          top
tab_bar_margin_height 4.0 0.0
tab_title_template    "{index}: {title[:30]}"
window_padding_width  10 12
# Efek kursor "meluncur" pas loncat
cursor_trail          3
cursor_trail_decay    0.08 0.3

# ---------- Buat ngoding ----------
enabled_layouts       splits,stack
undercurl_style       thick-sparse
copy_on_select        yes
strip_trailing_spaces smart
# Notif kalau command lama (>10 dtk) selesai pas window gak lagi difokus
notify_on_cmd_finish  unfocused 10.0
# Ngurangin input lag
input_delay           2
repaint_delay         8

# Split & navigasi (mirip iTerm/macOS)
map ctrl+shift+d         launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+m         toggle_layout stack
map ctrl+alt+h           neighboring_window left
map ctrl+alt+l           neighboring_window right
map ctrl+alt+k           neighboring_window up
map ctrl+alt+j           neighboring_window down
